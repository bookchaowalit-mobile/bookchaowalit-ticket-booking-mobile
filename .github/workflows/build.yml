name: Build Mobile App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Core library (build + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test tests/TicketBooking.Core.Tests --configuration Release
  # The MAUI app project is not built in CI yet: it is missing App.xaml,
  # MauiProgram.cs, platform folders and two referenced pages. See
  # docs/UPGRADE-PLAN.md (P0) — add a MAUI job once the app compiles.
